<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Thông tin khách hàng')"></head>
<body class="d-flex flex-column h-100">
    <div th:replace="fragments/header :: header"></div>

    <div class="container-fluid flex-grow-1">
        <div class="row h-100">
            <nav th:replace="fragments/sidebar :: sidebar"></nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 mt-5 pt-3 main-content">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2"><i class="fas fa-user me-2 text-primary"></i><span th:text="${guest.id != null ? 'Cập nhật thông tin khách' : 'Thêm hồ sơ khách hàng mới'}">Thêm khách</span></h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <a th:href="@{/guests}" class="btn btn-sm btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i> Quay lại</a>
                    </div>
                </div>

                <div class="row justify-content-center">
                    <div class="col-md-8 col-lg-7">
                        <div class="card shadow-sm border-0">
                            <div class="card-body p-4">
                                <form th:action="${guest.id != null ? '/guests/' + guest.id : '/guests'}" method="post" th:object="${guest}">
                                    <div class="row">
                                        <div class="col-md-7 mb-3">
                                            <label class="form-label fw-bold">Họ và tên khách hàng <span class="text-danger">*</span></label>
                                            <input type="text" th:field="*{fullName}" class="form-control" placeholder="Nguyễn Văn A" required/>
                                        </div>
                                        <div class="col-md-5 mb-3">
                                            <label class="form-label fw-bold">Số điện thoại <span class="text-danger">*</span></label>
                                            <input type="tel" th:field="*{phone}" class="form-control" placeholder="0905123456" required/>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label fw-bold">Loại giấy tờ</label>
                                            <select th:field="*{idType}" class="form-select">
                                                <option th:each="t : ${idTypes}" th:value="${t}" th:text="${t.name()}"></option>
                                            </select>
                                        </div>
                                        <div class="col-md-8 mb-3">
                                            <label class="form-label fw-bold">Số CCCD / Hộ chiếu / GPLX</label>
                                            <input type="text" th:field="*{idNumber}" class="form-control" placeholder="Số định danh hoặc passport..."/>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-7 mb-3">
                                            <label class="form-label">Email</label>
                                            <input type="email" th:field="*{email}" class="form-control" placeholder="guest@example.com"/>
                                        </div>
                                        <div class="col-md-5 mb-3">
                                            <label class="form-label">Quốc tịch</label>
                                            <input type="text" th:field="*{nationality}" class="form-control" placeholder="Việt Nam"/>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Địa chỉ</label>
                                        <input type="text" th:field="*{address}" class="form-control" placeholder="Địa chỉ thường trú..."/>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Ghi chú sở thích / Yêu cầu đặc biệt</label>
                                        <textarea th:field="*{notes}" class="form-control" rows="3" placeholder="Ví dụ: Thích phòng tầng cao, dị ứng lông mèo, ăn chay..."></textarea>
                                    </div>

                                    <div class="d-flex justify-content-end gap-2 mt-4">
                                        <a th:href="@{/guests}" class="btn btn-secondary">Hủy bỏ</a>
                                        <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i> Lưu thông tin khách</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <div th:replace="fragments/footer :: footer"></div>
</body>
</html>
