<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Thông tin tài khoản')"></head>
<body class="d-flex flex-column h-100">
    <div th:replace="fragments/header :: header"></div>

    <div class="container-fluid flex-grow-1">
        <div class="row h-100">
            <nav th:replace="fragments/sidebar :: sidebar"></nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 mt-5 pt-3 main-content">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2"><i class="fas fa-user-shield me-2 text-primary"></i><span th:text="${user.id != null ? 'Cập nhật tài khoản: ' + user.username : 'Thêm tài khoản người dùng mới'}">Thêm tài khoản</span></h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <a th:href="@{/admin/users}" class="btn btn-sm btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i> Quay lại</a>
                    </div>
                </div>

                <div class="row justify-content-center">
                    <div class="col-md-8 col-lg-6">
                        <div class="card shadow-sm border-0">
                            <div class="card-body p-4">
                                <form th:action="${user.id != null ? '/admin/users/' + user.id : '/admin/users'}" method="post" th:object="${user}">
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Tên đăng nhập (Username) <span class="text-danger">*</span></label>
                                        <input type="text" th:field="*{username}" class="form-control" th:readonly="${user.id != null}" required/>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Mật khẩu <span th:if="${user.id == null}" class="text-danger">*</span></label>
                                        <input type="password" th:field="*{password}" class="form-control" th:required="${user.id == null}" placeholder="Để trống nếu không đổi mật khẩu"/>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Họ và tên nhân viên <span class="text-danger">*</span></label>
                                        <input type="text" th:field="*{fullName}" class="form-control" placeholder="Nguyễn Văn A" required/>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Email</label>
                                            <input type="email" th:field="*{email}" class="form-control" placeholder="user@example.com"/>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Số điện thoại</label>
                                            <input type="tel" th:field="*{phone}" class="form-control" placeholder="0905123456"/>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Vai trò phân quyền (Role) <span class="text-danger">*</span></label>
                                        <select th:field="*{role}" class="form-select" required>
                                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r.name()}"></option>
                                        </select>
                                    </div>
                                    <div class="form-check mb-3">
                                        <input type="checkbox" th:field="*{enabled}" class="form-check-input" id="enabledCheck"/>
                                        <label class="form-check-label fw-bold" for="enabledCheck">Kích hoạt tài khoản</label>
                                    </div>

                                    <div class="d-flex justify-content-end gap-2 mt-4">
                                        <a th:href="@{/admin/users}" class="btn btn-secondary">Hủy bỏ</a>
                                        <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i> Lưu tài khoản</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <div th:replace="fragments/footer :: footer"></div>
</body>
</html>
