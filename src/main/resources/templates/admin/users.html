<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Quản lý người dùng')"></head>
<body class="d-flex flex-column h-100">
    <div th:replace="fragments/header :: header"></div>

    <div class="container-fluid flex-grow-1">
        <div class="row h-100">
            <nav th:replace="fragments/sidebar :: sidebar"></nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 mt-5 pt-3 main-content">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2"><i class="fas fa-user-shield me-2 text-primary"></i>Quản trị tài khoản & Phân quyền</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <a th:href="@{/admin/users/new}" class="btn btn-sm btn-primary"><i class="fas fa-plus me-1"></i> Thêm tài khoản mới</a>
                    </div>
                </div>

                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle me-1"></i> <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-circle me-1"></i> <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Tên đăng nhập</th>
                                        <th>Họ và tên</th>
                                        <th>Email</th>
                                        <th>Số điện thoại</th>
                                        <th>Vai trò (Role)</th>
                                        <th>Trạng thái</th>
                                        <th>Hành động</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="u : ${users}">
                                        <td><strong class="text-primary" th:text="${u.username}">admin</strong></td>
                                        <td th:text="${u.fullName}">Quản trị viên</td>
                                        <td th:text="${u.email}">admin@example.com</td>
                                        <td th:text="${u.phone}">0905123456</td>
                                        <td>
                                            <span th:if="${u.role.name() == 'ROLE_ADMIN'}" class="badge bg-danger">ADMIN (Toàn quyền)</span>
                                            <span th:if="${u.role.name() == 'ROLE_MANAGER'}" class="badge bg-primary">MANAGER (Quản lý)</span>
                                            <span th:if="${u.role.name() == 'ROLE_RECEPTIONIST'}" class="badge bg-success">RECEPTIONIST (Lễ tân)</span>
                                            <span th:if="${u.role.name() == 'ROLE_CUSTOMER'}" class="badge bg-secondary">CUSTOMER (Khách)</span>
                                        </td>
                                        <td>
                                            <span th:if="${u.enabled}" class="badge bg-success">Hoạt động</span>
                                            <span th:unless="${u.enabled}" class="badge bg-secondary">Bị khóa</span>
                                        </td>
                                        <td>
                                            <a th:href="@{'/admin/users/' + ${u.id} + '/edit'}" class="btn btn-sm btn-outline-primary me-1"><i class="fas fa-edit"></i></a>
                                            <form th:action="@{'/admin/users/' + ${u.id} + '/delete'}" method="post" class="d-inline" onsubmit="return confirm('Bạn có chắc muốn xóa người dùng này?');">
                                                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="fas fa-trash"></i></button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <div th:replace="fragments/footer :: footer"></div>
</body>
</html>
