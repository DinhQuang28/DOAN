<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Lỗi 404 - Không tìm thấy')"></head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="text-center">
        <h1 class="display-1 fw-bold text-warning"><i class="fas fa-exclamation-triangle"></i> 404</h1>
        <h2 class="mb-4">Không tìm thấy trang</h2>
        <p class="lead mb-4">Trang bạn đang tìm kiếm không tồn tại hoặc đã bị di chuyển.</p>
        <button onclick="window.history.back()" class="btn btn-outline-secondary me-2"><i class="fas fa-arrow-left me-2"></i>Quay lại</button>
        <a th:href="@{/dashboard}" class="btn btn-primary"><i class="fas fa-home me-2"></i>Về trang chủ</a>
    </div>
</body>
</html>
