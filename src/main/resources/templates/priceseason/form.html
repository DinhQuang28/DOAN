<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Cấu hình giá theo mùa')"></head>
<body class="d-flex flex-column h-100">
    <div th:replace="fragments/header :: header"></div>

    <div class="container-fluid flex-grow-1">
        <div class="row h-100">
            <nav th:replace="fragments/sidebar :: sidebar"></nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 mt-5 pt-3 main-content">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2"><i class="fas fa-tags me-2 text-primary"></i><span th:text="${season.id != null ? 'Cập nhật giá theo mùa' : 'Thêm giá theo mùa mới'}">Thêm giá theo mùa</span></h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <a th:href="@{/price-seasons}" class="btn btn-sm btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i> Quay lại</a>
                    </div>
                </div>

                <div class="row justify-content-center">
                    <div class="col-md-8 col-lg-6">
                        <div class="card shadow-sm border-0">
                            <div class="card-body p-4">
                                <form th:action="${season.id != null ? '/price-seasons/' + season.id : '/price-seasons'}" method="post" th:object="${season}">
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Loại phòng áp dụng <span class="text-danger">*</span></label>
                                        <select th:field="*{roomType}" class="form-select" required>
                                            <option value="">-- Chọn loại phòng --</option>
                                            <option th:each="rt : ${roomTypes}" th:value="${rt.id}" th:text="${rt.name}"></option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Tên mùa / Dịp lễ <span class="text-danger">*</span></label>
                                        <input type="text" th:field="*{seasonName}" class="form-control" placeholder="Ví dụ: Lễ 30/4 - 1/5, Cao điểm hè, Tết Nguyên Đán..." required/>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label fw-bold">Từ ngày <span class="text-danger">*</span></label>
                                            <input type="date" th:field="*{startDate}" class="form-control" required/>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label fw-bold">Đến ngày <span class="text-danger">*</span></label>
                                            <input type="date" th:field="*{endDate}" class="form-control" required/>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Giá áp dụng / đêm (VNĐ) <span class="text-danger">*</span></label>
                                        <input type="number" th:field="*{price}" class="form-control" step="10000" min="0" required/>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Ghi chú thêm</label>
                                        <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Ghi chú về chính sách giá..."></textarea>
                                    </div>

                                    <div class="d-flex justify-content-end gap-2 mt-4">
                                        <a th:href="@{/price-seasons}" class="btn btn-secondary">Hủy bỏ</a>
                                        <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i> Lưu cấu hình giá</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <div th:replace="fragments/footer :: footer"></div>
</body>
</html>
