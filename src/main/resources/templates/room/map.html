<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Sơ đồ phòng trực quan')"></head>
<body class="d-flex flex-column h-100">
    <div th:replace="fragments/header :: header"></div>

    <div class="container-fluid flex-grow-1">
        <div class="row h-100">
            <nav th:replace="fragments/sidebar :: sidebar"></nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 mt-5 pt-3 main-content">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2"><i class="fas fa-th-large me-2 text-primary"></i>Sơ đồ trạng thái phòng thời gian thực</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <a th:href="@{/rooms}" class="btn btn-sm btn-outline-secondary me-2"><i class="fas fa-list me-1"></i> Xem dạng danh sách</a>
                        <a th:href="@{/bookings/new}" class="btn btn-sm btn-primary"><i class="fas fa-plus me-1"></i> Đặt phòng ngay</a>
                    </div>
                </div>

                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle me-1"></i> <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Legend -->
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body py-2">
                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                            <span class="fw-bold text-muted me-2"><i class="fas fa-info-circle me-1"></i> Chú thích trạng thái:</span>
                            <span class="badge bg-success px-3 py-2"><i class="fas fa-check-circle me-1"></i> Trống (AVAILABLE)</span>
                            <span class="badge bg-danger px-3 py-2"><i class="fas fa-bed me-1"></i> Đang ở (OCCUPIED)</span>
                            <span class="badge bg-warning text-dark px-3 py-2"><i class="fas fa-broom me-1"></i> Đang dọn (CLEANING)</span>
                            <span class="badge bg-secondary px-3 py-2"><i class="fas fa-wrench me-1"></i> Bảo trì (MAINTENANCE)</span>
                            <span class="badge bg-dark px-3 py-2"><i class="fas fa-ban me-1"></i> Ngừng SD (OUT_OF_ORDER)</span>
                        </div>
                    </div>
                </div>

                <!-- Floor grids -->
                <div th:each="floorEntry : ${roomMap}" class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-light d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-bold"><i class="fas fa-layer-group me-2 text-secondary"></i>Tầng <span th:text="${floorEntry.key}">1</span></h5>
                        <span class="badge bg-primary rounded-pill" th:text="${#lists.size(floorEntry.value)} + ' phòng'">5 phòng</span>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div th:each="r : ${floorEntry.value}" class="col-6 col-md-4 col-lg-3 col-xl-2">
                                <div th:class="'card h-100 text-center shadow-sm border-0 room-box ' + 
                                    (${r.status.name() == 'AVAILABLE'} ? 'border-start border-success border-4' : 
                                    (${r.status.name() == 'OCCUPIED'} ? 'border-start border-danger border-4' : 
                                    (${r.status.name() == 'CLEANING'} ? 'border-start border-warning border-4' : 'border-start border-secondary border-4')))">
                                    <div class="card-body p-3">
                                        <h3 class="card-title fw-bold mb-1" th:text="${r.roomNumber}">101</h3>
                                        <small class="text-muted d-block mb-2 text-truncate" th:text="${r.roomType != null ? r.roomType.name : 'N/A'}">Phòng Đơn</small>
                                        
                                        <div class="mb-3">
                                            <span th:if="${r.status.name() == 'AVAILABLE'}" class="badge bg-success">Trống</span>
                                            <span th:if="${r.status.name() == 'OCCUPIED'}" class="badge bg-danger">Có khách</span>
                                            <span th:if="${r.status.name() == 'CLEANING'}" class="badge bg-warning text-dark">Đang dọn</span>
                                            <span th:if="${r.status.name() == 'MAINTENANCE'}" class="badge bg-secondary">Bảo trì</span>
                                            <span th:if="${r.status.name() == 'OUT_OF_ORDER'}" class="badge bg-dark">Ngừng SD</span>
                                        </div>

                                        <!-- Fast status change dropdown -->
                                        <form th:action="@{'/rooms/' + ${r.id} + '/status'}" method="post">
                                            <input type="hidden" name="redirect" value="map"/>
                                            <select name="status" class="form-select form-select-sm text-center" onchange="this.form.submit()">
                                                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st.name()}" th:selected="${r.status == st}"></option>
                                            </select>
                                        </form>
                                    </div>
                                    <div class="card-footer bg-light p-2 border-0">
                                        <a th:if="${r.status.name() == 'AVAILABLE'}" th:href="@{'/bookings/new?roomIds=' + ${r.id}}" class="btn btn-sm btn-outline-success w-100 py-0"><i class="fas fa-plus"></i> Đặt phòng</a>
                                        <a th:if="${r.status.name() == 'CLEANING'}" th:href="@{'/rooms/' + ${r.id} + '/edit'}" class="btn btn-sm btn-outline-warning w-100 py-0 text-dark"><i class="fas fa-edit"></i> Chi tiết</a>
                                        <a th:if="${r.status.name() == 'OCCUPIED'}" th:href="@{/bookings}" class="btn btn-sm btn-outline-danger w-100 py-0"><i class="fas fa-user"></i> Xem đơn</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <div th:replace="fragments/footer :: footer"></div>
</body>
</html>
