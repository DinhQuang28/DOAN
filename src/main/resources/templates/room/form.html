<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Thông tin phòng')"></head>
<body class="d-flex flex-column h-100">
    <div th:replace="fragments/header :: header"></div>

    <div class="container-fluid flex-grow-1">
        <div class="row h-100">
            <nav th:replace="fragments/sidebar :: sidebar"></nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 mt-5 pt-3 main-content">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2"><i class="fas fa-door-open me-2 text-primary"></i><span th:text="${room.id != null ? 'Cập nhật phòng: ' + room.roomNumber : 'Thêm phòng mới'}">Thêm phòng</span></h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <a th:href="@{/rooms}" class="btn btn-sm btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i> Quay lại</a>
                    </div>
                </div>

                <div class="row justify-content-center">
                    <div class="col-md-8 col-lg-6">
                        <div class="card shadow-sm border-0">
                            <div class="card-body p-4">
                                <form th:action="${room.id != null ? '/rooms/' + room.id : '/rooms'}" method="post" th:object="${room}">
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Số phòng / Tên phòng <span class="text-danger">*</span></label>
                                        <input type="text" th:field="*{roomNumber}" class="form-control" placeholder="Ví dụ: 101, 202..." required/>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Tầng <span class="text-danger">*</span></label>
                                        <input type="number" th:field="*{floor}" class="form-control" min="1" max="20" required/>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Loại phòng <span class="text-danger">*</span></label>
                                        <select th:field="*{roomType}" class="form-select" required>
                                            <option value="">-- Chọn loại phòng --</option>
                                            <option th:each="rt : ${roomTypes}" th:value="${rt.id}" th:text="${rt.name + ' (' + #numbers.formatDecimal(rt.basePrice, 0, 'COMMA', 0, 'POINT') + ' đ/đêm)'}"></option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Trạng thái phòng</label>
                                        <select th:field="*{status}" class="form-select">
                                            <option th:each="st : ${statuses}" th:value="${st}" th:text="${st.name()}"></option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Ghi chú</label>
                                        <textarea th:field="*{notes}" class="form-control" rows="3" placeholder="Ghi chú thêm về phòng này (ví dụ: view hồ bơi, ban công thoáng...)"></textarea>
                                    </div>

                                    <div class="d-flex justify-content-end gap-2 mt-4">
                                        <a th:href="@{/rooms}" class="btn btn-secondary">Hủy bỏ</a>
                                        <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i> Lưu thông tin</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <div th:replace="fragments/footer :: footer"></div>
</body>
</html>
