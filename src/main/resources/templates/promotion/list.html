<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Quản lý mã khuyến mãi')"></head>
<body class="d-flex flex-column h-100">
    <div th:replace="fragments/header :: header"></div>

    <div class="container-fluid flex-grow-1">
        <div class="row h-100">
            <nav th:replace="fragments/sidebar :: sidebar"></nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 mt-5 pt-3 main-content">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2"><i class="fas fa-percent me-2 text-primary"></i>Quản lý khuyến mãi & Voucher</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <a th:href="@{/promotions/new}" class="btn btn-sm btn-primary"><i class="fas fa-plus me-1"></i> Tạo mã mới</a>
                    </div>
                </div>

                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle me-1"></i> <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Mã Voucher</th>
                                        <th>Tên chương trình</th>
                                        <th>Mức giảm</th>
                                        <th>Loại</th>
                                        <th>Số lượt dùng</th>
                                        <th>Trạng thái</th>
                                        <th>Hành động</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${#lists.isEmpty(promotions)}">
                                        <td colspan="7" class="text-center py-4 text-muted">Chưa có mã khuyến mãi nào.</td>
                                    </tr>
                                    <tr th:each="p : ${promotions}">
                                        <td><span class="badge bg-danger fs-6" th:text="${p.code}">WELCOME10</span></td>
                                        <td><strong class="text-dark" th:text="${p.name}">Chào mừng khách mới</strong></td>
                                        <td>
                                            <span class="text-success fw-bold" th:text="${p.type == 'PERCENTAGE' ? p.value + '%' : #numbers.formatDecimal(p.value, 0, 'COMMA', 0, 'POINT') + ' đ'}">10%</span>
                                        </td>
                                        <td>
                                            <span th:if="${p.type == 'PERCENTAGE'}" class="badge bg-info text-dark">Phần trăm</span>
                                            <span th:unless="${p.type == 'PERCENTAGE'}" class="badge bg-secondary">Số tiền cố định</span>
                                        </td>
                                        <td>
                                            <span th:text="${p.currentUses} + ' / ' + (${p.maxUses > 0 ? p.maxUses : 'Không giới hạn'})">0 / 100</span>
                                        </td>
                                        <td>
                                            <span th:if="${p.active}" class="badge bg-success">Đang hiệu lực</span>
                                            <span th:unless="${p.active}" class="badge bg-secondary">Hết hạn / Khóa</span>
                                        </td>
                                        <td>
                                            <a th:href="@{'/promotions/' + ${p.id} + '/edit'}" class="btn btn-sm btn-outline-primary me-1"><i class="fas fa-edit"></i></a>
                                            <form th:action="@{'/promotions/' + ${p.id} + '/delete'}" method="post" class="d-inline" onsubmit="return confirm('Bạn có chắc muốn xóa mã khuyến mãi này?');">
                                                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="fas fa-trash"></i></button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <div th:replace="fragments/footer :: footer"></div>
</body>
</html>
