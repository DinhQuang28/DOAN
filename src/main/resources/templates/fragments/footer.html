<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<footer th:fragment="footer" class="footer mt-auto py-3 bg-white border-top text-center no-print">
    <div class="container-fluid px-4 d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
        <span class="text-muted text-sm">
            © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2026</span> 
            <strong class="text-dark">Sunshine Homestay & Resort</strong> — Phiên bản 2.5 Pro
        </span>
        <div class="text-muted text-xs d-flex align-items-center gap-3">
            <span><i class="fas fa-shield-alt text-success me-1"></i>Bảo mật SSL</span>
            <span><i class="fas fa-qrcode text-primary me-1"></i>Tích hợp VietQR 24/7</span>
            <span><i class="fas fa-headset text-info me-1"></i>Hỗ trợ: 0905.123.456</span>
        </div>
    </div>
    
    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/webjars/sockjs-client/1.5.1/sockjs.min.js}"></script>
    <script th:src="@{/webjars/stomp-websocket/2.3.4/stomp.min.js}"></script>
    <script th:src="@{/js/app.js}"></script>
</footer>
</body>
</html>
